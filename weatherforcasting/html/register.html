<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — WeatherCast</title>
    <meta name="description" content="Create a WeatherCast account to save your search history, favourite cities, and get personalized weather updates.">
    <link rel="stylesheet" href="../css/weather.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="weather.html" class="nav-logo">
                <div class="logo-icon">⛅</div>
                <span>WeatherCast</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="weather.html">Home</a>
                <a href="forecast.html">Forecast</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-auth" id="navAuth"></div>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">✨</div>
                    <h2>Create Account</h2>
                    <p>Join WeatherCast to unlock all features</p>
                </div>

                <div class="auth-message" id="authMessage"></div>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="regName" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="field-error" id="nameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="field-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" required minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
                        </div>
                        <div class="field-error" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="regConfirmPassword" name="confirm_password" placeholder="Re-enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regConfirmPassword', this)">👁️</button>
                        </div>
                        <div class="field-error" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="btn-submit" id="registerBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loading"><div class="mini-spinner"></div></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">⛅ WeatherCast</div>
            <p>© 2026 WeatherCast. All rights reserved.</p>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/validation.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
