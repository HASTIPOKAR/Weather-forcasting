<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — WeatherCast</title>
    <meta name="description" content="Log in to your WeatherCast account to access search history, favourite cities, and personalized weather features.">
    <link rel="stylesheet" href="../css/weather.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="weather.html" class="nav-logo">
                <div class="logo-icon">⛅</div>
                <span>WeatherCast</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="weather.html">Home</a>
                <a href="forecast.html">Forecast</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-auth" id="navAuth"></div>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">🔐</div>
                    <h2>Welcome Back</h2>
                    <p>Sign in to your WeatherCast account</p>
                </div>

                <div class="auth-message" id="authMessage"></div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="field-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
                        </div>
                        <div class="field-error" id="passwordError"></div>
                    </div>

                    <button type="submit" class="btn-submit" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loading"><div class="mini-spinner"></div></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">⛅ WeatherCast</div>
            <p>© 2026 WeatherCast. All rights reserved.</p>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/validation.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
