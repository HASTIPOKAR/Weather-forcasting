<!DOCTYPE html>
<html>
<head>
    <title>Pizza Shop 2.0</title>
</head>
<body bgcolor="#add8e6">

<form>
    <table border="2"  align="center" height="400" width="400">
        
        <tr>
            <th colspan="2">Pizza Shop 2.0</th>
        </tr>

        <tr>
            <td width="200">Name</td>
            <td>
                <input type="text" size="40">
            </td>
        </tr>

        <tr>
            <td>Pizza Topping</td>
            <td>
                <input type="radio" name="pizza"> Supreme <br>
                <input type="radio" name="pizza"> Vegetarian <br>
                <input type="radio" name="pizza"> Hawaiian
            </td>
        </tr>

        <tr>
            <td>Pizza Sauce</td>
            <td>
                <select>
                    <option>Tomato</option>
                    <option>Barbeque</option>
                    <option>White Sauce</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Optional Extras</td>
            <td>
                <input type="checkbox"> Extra Cheese
                <input type="checkbox"> Gluten Free Base
            </td>
        </tr>

        <tr>
            <td colspan="2">
                Delivery Instructions:<br><br>
                <textarea rows="5" cols="80"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Send my Order">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
