<html>
    <head>
        <style>
            *{
                font-style: italic;
                font-size: 20px;
            }
           #p{
                color: blue;
                text-align: right;
                text-decoration: underline;
                text-transform: capitalize;
                text-indent: 50px;
                text-shadow: 2px 2px 5px red;
                letter-spacing: 5px;
                line-height: 1.3;
            }
            #Q{
                color:brown;
                text-align: center;
                text-decoration: overline;
                text-transform:lowercase;
                text-indent: 30px;
                text-shadow: 1px 1px 5px gray; 
                letter-spacing: 5px;
                line-height: 1.2;
            }
             #Y{
                color:green;
                text-align: left;
                text-decoration: line-through;
                text-transform:uppercase;
                text-indent: 20px;
                text-shadow: 3px 3px 5px gray;
                letter-spacing: 5px;
                line-height: 1.5;
            }
            .v{
                Font: italic bold 20px/20px Georgia, serif;
            }
            .w{
                font: normal small-caps bold 20px/20px Georgia, serif;
            }
                </style>
    </head>
    <body>
        <p id="Y">HLO</p>
        <p id="Q">welcome</p>
       <p id="p">How are you?</p>
       <p class="v">This is a paragraph with italic bold font.</p>
       <p class="w">This is a paragraph with small-caps bold font.</p>
    </body>
</html>
