<!DOCTYPE html>
<html>
<head>
    <title>CSS Backgrounds and Links</title>
    <style>
        body {
            background-color: lightpink; 
            background-image: url('weather.jpeg');      
            background-repeat: repeat; 
            background-position: center; 
            background-attachment: fixed; 
            
        }
        img{
            opacity: 0.5;
        }
        a:link {
            color: #123456;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: #FF0500;
        }
        a:hover {
            color: #1234FF;
            text-decoration: underline;
        }
        a:active {
            color: #FF10FF;
        }
        
        div{
            width: 300px;
            height: 300px;
            background-image: linear-gradient(to right, red, yellow,green,blue,pink);
            background-repeat: no-repeat;
            border: 5px solid #123456;

        }
    </style>
</head>
<body> 
    <div>
        <h2>Navigation Links</h2>
        <hr>
        <br>
        <p><a href="https://www.youtube.com" target="_blank">Go to YouTube</a></p>
        <br>
        <p><a href="https://www.geeksforgeeks.org" target="_blank">Go to GeeksforGeeks</a></p>
        <br>
        <p><a href="https://thisisawebsite.invalid" target="_blank">Unvisited Fake Link</a></p>
    </div>
</body>
</html>
