<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Practical 9 - Test Average</title>
    <script type="text/javascript">
        function calculateAverage() {

            var regno = document.getElementById("regno").value;
            var subcode = document.getElementById("subcode").value;
            var test1 = document.getElementById("test1").value;
            var test2 = document.getElementById("test2").value;
            var test3 = document.getElementById("test3").value;

            if (regno == "") {
                alert("Please enter Register Number");
                return;
            }

            if (subcode == "") {
                alert("Please enter Sub-Code");
                return;
            }

            if (test1 == "" || test2 == "" || test3 == "") {
                alert("Please enter marks for all three tests");
                return;
            }

            test1 = Number(test1);
            test2 = Number(test2);
            test3 = Number(test3);
            

            if (isNaN(test1) || isNaN(test2) || isNaN(test3)) {
                alert("Marks must be numbers");
                return;
            }
            if (test1 < 0 || test1 > 100 ||
                test2 < 0 || test2 > 100 ||
                test3 < 0 || test3 > 100) {
                alert("Marks must be between 0 and 100");
                return;
            }
            var marks = [test1, test2, test3];
            marks.sort(function(a, b) {
                return b - a;
            });
            var average = (marks[0] + marks[1]) / 2;

            alert("Register Number: " + regno +
                  "\nSub-Code: " + subcode +
                  "\nAverage of Best Two Tests: " + average);
        }
    </script>
</head>
<body>
    <h2>Student Test Marks</h2>
    <form action="#" method="post">
            <label for="regno">Register Number:</label>
            <input type="text" id="regno" name="regno" />
        </p>
        <p>
            <label for="subcode">Sub-Code:</label>
            <input type="text" id="subcode" name="subcode" />
        </p>
        <p>
            <label for="test1">Test 1 Marks:</label>
            <input type="text" id="test1" name="test1" />
        </p>
        <p>
            <label for="test2">Test 2 Marks:</label>
            <input type="text" id="test2" name="test2" />
        </p>
        <p>
            <label for="test3">Test 3 Marks:</label>
            <input type="text" id="test3" name="test3" />
        </p>
        <p>
            <input type="button"
                   value="Calculate Average"
                   onclick="calculateAverage();" />
        </p>
    </form>
</body>
</html>
