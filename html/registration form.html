<html>
    <head>
        <title>form</title>
    </head>
    <body bgcolor="#ADD8E6">
        <form>
            <table border="2" align="center" height="500" width="300">
            <fieldset>            
                <legend align="center"><b>Sign-up form</b></legend>
            <label> FirstName:</label>
            <input type="text" maxlength="10" placeholder="enter your name"/><br><br>
             <label>Last Name:</label>
            <input type="text" maxlength="10" value="enter your name"readonly name ="t1"/><br><br>
            <label>contact number: </label>
            <input type="number"/><br><br>  
            <label>Email: </label>
            <input type="Email"/><br><br>
            <label>Date of birth:</label>
            <input type="date"/><br><br>
            <label>Password: </label>
            <input type="password"/><br><br>
            <label>Upload files:</label>
            <input type="file"/><br><br>
            <label>Rating:</label>
            1<input type="range"/>5<br><br>
            <label>Search:</label>
            <input type="search"/><br><br>
            <label>Gender:</label>
            <input type="radio"name="g1"/>Male
            <input type="radio" name="g1"/>Female
            <input type="radio" name="g1"/>Other<br><br>
            <label>Hobbies:</label>
            <input type="checkbox" name="h1"/>Reading
            <input type="checkbox" name="h1"/>Treaveling
            <input type="checkbox" name="h1"/>Coding<br><br>
            <label>Address:</label>
            <textarea rows="4" cols="7"></textarea><br><br>
            <label>City:</label>
            <select>
                <option selected disabled hidden>--select city--</option>
                <option>surat</option>
                <option>mumbai</option>
                <option>nagpur</option>
            </select>
            <label>Image:</label>
            <input type="image" height="100" width="100"/><br><br>
            <label>hidden:</label>
            <input type="hidden"/><br><br>
            <label>submit:</label>
            <input type="submit"/><br><br>
            <label>Reset:</label>
            <input type="reset"/><br><br>
            <label>Button:</label>
            <input type="button" value="click me"/><br><br> 
             </fieldset>
             </table>
        </form>
    </body>
</html>
