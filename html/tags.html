<!DOCTYPE html>
<html>
    <head>
        <title>HEADER AND FOOTER</title>
        <body>
    </head>
    <body>
        <header>
            <h1>Welcome to My Website</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <figure>
            <a href="images.jpeg" target="_blank" width="200" height="200">
                <img src="images.jpeg" alt="Sample Image" width="200" height="200">
            </a>
            <figcaption>PPSU</figcaption>
        </figure>

        <footer>
            <p>for more information, please visit our <a href="#">contact page</a>.</p>
            <dialog open>
                <p>Welcome to our website! We hope you find the information you need.</p>
                
            </dialog>
            <dialog close>
                <p>Thank you for visiting our website!</p>
                
            </dialog>
            <a href="https://erp.ppsu.ac.in/Login.aspx" target="_blank">Visit our website</a>
        </footer>
        
    </body>
</html>

<html>
    <h1>The datalist Element</h1>

    <form>
        <label for="browser">Choose your browser from the list:</label>
        <input list="browsers" name="browser" id="browser">

        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Safari">
            <option value="Edge">
            <option value="Opera">
        </datalist>
        <input type="submit">
    </form>
</html>
